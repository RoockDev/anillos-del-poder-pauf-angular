<div class="tablaPersonajes">
    
    <div class="accion-superior">
        <button (click)="crearPersonaje()">Crear Personaje</button>
    </div>

    <p-table [value]="personajes" [tableStyle]="{ 'min-width': '50rem' }">
        
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Raza</th>
                <th>Fecha Nacimiento</th>
                <th style="width: 200px; text-align: center;">Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.nombre }}</td>
                <td>{{ item.raza }}</td>
                <td>{{ item.fechaNacimiento }}</td>
                <td style="text-align: center;">
                    <div class="botones-accion">
                        <button (click)="editar(item.id)">Editar</button>
                        
                        <button (click)="borrar(item.id)">Borrar</button>
                    </div>
                </td>
            </tr>
        </ng-template>

    </p-table>

    @if (personajes.length === 0) {
        <p class="sin-datos">No se encontraron personajes.</p>
    }
</div>
